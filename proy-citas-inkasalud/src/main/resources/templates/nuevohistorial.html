<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Registrar Nuevo Historial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function obtenerPacientePorId(id) {
        // Verificar si el id es un número válido
        if (!id || id.trim() === '' || isNaN(id)) {
            alert("Por favor ingrese un ID de paciente válido.");
            return;
        }

        console.log(`Buscando paciente con ID: ${id}`);
        fetch(`/pacientes/obtenerPacientePorId?id=${id}`, { // <--- Endpoint para buscar paciente por ID
            method: 'GET',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            if (response.ok) {
                return response.json();
            } else {
                // Si el estado no es OK, leer el mensaje de error del cuerpo de la respuesta
                return response.json().then(errorData => {
                    throw new Error(errorData.mensaje || 'Paciente no encontrado');
                });
            }
        })
        .then(data => {
            console.log("Paciente encontrado:", data);

            // Llenar los campos en el formulario
            document.getElementById('idPaciente').value = data.idPaciente; // Campo oculto del form
            document.getElementById('nombrePaciente').value = data.nombre;
            document.getElementById('apellidoPaciente').value = data.apellido;
        })
        .catch(error => {
            console.error('Error:', error.message);
            alert("Error: " + error.message);
            // Limpiar los campos si no se encuentra el paciente
            document.getElementById('idPaciente').value = '';
            document.getElementById('nombrePaciente').value = '';
            document.getElementById('apellidoPaciente').value = '';
        });
    }

    // Llamar la función cuando se haga clic en el botón de buscar
    function cargarPacientePorId() {
        const id = document.getElementById('idPacienteBuscar').value; // Usar el ID del campo de búsqueda
        if (!id) {
            alert("Por favor, ingresa un ID de paciente.");
            return;
        }
        obtenerPacientePorId(id);
    }
  </script>
</head>

<body class="bg-light py-5">
<div class="container">
  <div class="card shadow-lg">
    <div class="card-header bg-primary text-white text-center">
      <h2>Registrar Nuevo Historial Clínico</h2>
    </div>
    <div class="card-body">
      <form th:action="@{/historial/guardar}" method="post">

        <!-- DNI Paciente -->
        <div class="mb-4">
          <label for="idPacienteBuscar" class="form-label">ID del Paciente</label>
          <div class="input-group">
            <input type="number" id="idPacienteBuscar" name="idPacienteBuscar" class="form-control" placeholder="Ingresa el ID del paciente" required>
            <button type="button" class="btn btn-success" onclick="cargarPacientePorId()">Buscar</button>
          </div>
        </div>

        <!-- Nombre del Paciente (solo lectura) -->
        <input type="hidden" id="idPaciente" name="idPaciente">

        <div class="mb-3">
          <label for="nombrePaciente" class="form-label">Nombre del Paciente</label>
          <input type="text" id="nombrePaciente" name="nombrePaciente" class="form-control" readonly required>
        </div>

        <!-- Apellido del Paciente (solo lectura) -->
        <div class="mb-3">
          <label for="apellidoPaciente" class="form-label">Apellido del Paciente</label>
          <input type="text" id="apellidoPaciente" name="apellidoPaciente" class="form-control" readonly required>
        </div>

        <!-- Fecha -->
        <div class="mb-3">
          <label for="fecha" class="form-label">Fecha del Historial Clínico</label>
          <input type="date" id="fecha" name="fecha" class="form-control" required>
        </div>

        <!-- Enfermedad -->
        <div class="mb-3">
          <label for="enfermedad" class="form-label">Enfermedad</label>
          <textarea id="enfermedad" name="enfermedad" class="form-control" rows="3" required></textarea>
        </div>

        <!-- Tratamiento -->
        <div class="mb-3">
          <label for="tratamiento" class="form-label">Tratamiento</label>
          <textarea id="tratamiento" name="tratamiento" class="form-control" rows="3" required></textarea>
        </div>

        <!-- Observaciones -->
        <div class="mb-3">
          <label for="observaciones" class="form-label">Observaciones</label>
          <textarea id="observaciones" name="observaciones" class="form-control" rows="3" required></textarea>
        </div>

        <!-- Botón Guardar -->
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Guardar Historial</button>
        </div>

      </form>
    </div>
  </div>
</div>
</body>
</html>
