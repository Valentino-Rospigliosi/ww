<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Actualizar Historial Clínico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Arial', sans-serif;
    }
    .container {
      margin-top: 50px;
    }
    .form-group label {
      font-weight: bold;
    }
    .form-control {
      border-radius: 10px;
    }
    .btn-primary {
      background-color: #4CAF50;
      border: none;
      border-radius: 25px;
      padding: 10px 20px;
      font-size: 16px;
    }
    .btn-primary:hover {
      background-color: #45a049;
    }
    .card {
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 15px;
      padding: 30px;
      background-color: #ffffff;
    }
    .card-header {
      background-color: #007bff;
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      padding: 15px;
      border-radius: 15px 15px 0 0;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
  </style>
</head>

<body>
<div class="container">
  <div class="card">
    <div class="card-header">
      Actualizar Historial Clínico
    </div>
    <form th:action="@{/historial/actualizar}" th:object="${historial}" method="POST">
      <div class="card-body">
        <input type="hidden" name="idHistorial" th:value="${historial.idHistorial}">
        <input type="hidden" id="idPaciente" name="idPaciente" th:value="${historial.idPaciente}" />

        <div class="form-group">
          <label for="nombrePaciente" class="form-label">Nombre del Paciente:</label>
          <input type="text" id="nombrePaciente" th:value="${historial.nombrePaciente}" readonly class="form-control">
        </div>

        <div class="form-group">
          <label for="apellidoPaciente" class="form-label">Apellido del Paciente:</label>
          <input type="text" id="apellidoPaciente" th:value="${historial.apellidoPaciente}" readonly class="form-control">
        </div>

        <div class="form-group">
          <label for="fecha" class="form-label">Fecha de la Historia:</label>
          <input type="date" id="fecha" th:value="${#dates.format(historial.fecha, 'yyyy-MM-dd')}" name="fecha" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="enfermedad" class="form-label">Enfermedad:</label>
          <input type="text" id="enfermedad" name="enfermedad" th:value="${historial.enfermedad}" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="tratamiento" class="form-label">Tratamiento:</label>
          <input type="text" id="tratamiento" name="tratamiento" th:value="${historial.tratamiento}" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="observaciones" class="form-label">Observaciones:</label>
          <input type="text" id="observaciones" name="observaciones" th:value="${historial.observaciones}" class="form-control" required>
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-primary">Actualizar Historial</button>
        </div>
      </div>
    </form>
  </div>
</div>
</body>
</html>
