<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Agregar Médico</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

  <!-- Custom Styles -->
  <style>
    body {
        background-color: #f8f9fa;
        font-family: 'Arial', sans-serif;
    }

    .container {
        max-width: 800px;
        margin-top: 50px;
    }

    h2 {
        font-size: 2rem;
        font-weight: 600;
        color: #343a40;
        margin-bottom: 30px;
        text-align: center;
    }

    .form-label {
        font-weight: 500;
        color: #495057;
    }

    .form-control {
        border-radius: 0.375rem;
        border-color: #ced4da;
        box-shadow: none;
    }

    .form-control:focus {
        border-color: #80bdff;
        box-shadow: 0 0 0 0.25rem rgba(0, 123, 255, 0.25);
    }

    .btn-primary {
        background-color: #007bff;
        border-color: #007bff;
        font-size: 1rem;
        padding: 12px 25px;
        width: 100%;
    }

    .btn-primary:hover {
        background-color: #0056b3;
        border-color: #0056b3;
    }

    .btn-secondary {
        background-color: #6c757d;
        border-color: #6c757d;
        font-size: 1rem;
        padding: 12px 25px;
        width: 100%;
        margin-top: 10px;
    }

    .btn-secondary:hover {
        background-color: #5a6268;
        border-color: #545b62;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-control::placeholder {
        color: #adb5bd;
    }
  </style>

  <!-- jQuery and Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="d-flex flex-column" style="min-height: 100vh;">

<div class="container">
  <h2>Agregar Médico</h2>

  <!-- Formulario para agregar un nuevo médico -->
  <form id="formAgregarMedico" th:action="@{/medicos/guardar}" th:object="${medicos}" method="post">

    <input type="hidden" th:field="*{idMedico}" />

    <!-- Campo Nombre -->
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" class="form-control" id="nombre" name="nombre" th:field="*{nombre}" placeholder="Ingrese el nombre del médico" required>
    </div>

    <!-- Campo Apellido -->
    <div class="mb-3">
      <label for="apellido" class="form-label">Apellido</label>
      <input type="text" class="form-control" id="apellido" name="apellido" th:field="*{apellido}" placeholder="Ingrese el apellido del médico" required>
    </div>

    <!-- Campo Especialidad -->
    <div class="mb-3">
      <label for="especialidad" class="form-label">Especialidad</label>
      <input type="text" class="form-control" id="especialidad" name="especialidad" th:field="*{especialidad}" placeholder="Ingrese la especialidad del médico" required>
    </div>

    <!-- Campo Teléfono -->
    <div class="mb-3">
      <label for="telefono" class="form-label">Teléfono</label>
      <input type="text" class="form-control" id="telefono" name="telefono" th:field="*{telefono}" placeholder="Ingrese número de teléfono" required>
    </div>

    <!-- Campo Email -->
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" name="email" th:field="*{email}" placeholder="Ingrese el email" required>
    </div>

    <!-- Campo Dirección -->
    <div class="mb-3">
      <label for="direccion" class="form-label">Dirección</label>
      <input type="text" class="form-control" id="direccion" name="direccion" th:field="*{direccion}" placeholder="Ingrese la dirección del médico" required>
    </div>

    <!-- Campo Disponibilidad -->
    <div class="mb-3">
      <label for="disponibilidad" class="form-label">Disponibilidad</label>
      <input type="text" class="form-control" id="disponibilidad" name="disponibilidad" th:field="*{disponibilidad}" placeholder="Ingrese disponibilidad" required>
    </div>

    <!-- Botón de Enviar -->
    <button type="submit" class="btn btn-primary">
      Registrar
    </button>

    <!-- Botón Regresar -->
    <a href="/medicos/listar" class="btn btn-secondary">
      Regresar
    </a>

  </form>
</div>

</body>

</html>
