<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Médico</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <!-- Custom Styles -->
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Arial', sans-serif;
        }

        .container {
            max-width: 800px;
            margin-top: 50px;
        }

        h2 {
            font-size: 2rem;
            font-weight: 600;
            color: #343a40;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-label {
            font-weight: 500;
            color: #495057;
        }

        .form-control {
            border-radius: 0.375rem;
            border-color: #ced4da;
            box-shadow: none;
        }

        .form-control:focus {
            border-color: #80bdff;
            box-shadow: 0 0 0 0.25rem rgba(0, 123, 255, 0.25);
        }

        .btn-dark {
            background-color: #343a40;
            border-color: #343a40;
            font-size: 1rem;
            padding: 12px 25px;
            width: 100%;
        }

        .btn-dark:hover {
            background-color: #23272b;
            border-color: #1d2124;
        }

        .btn-outline-secondary {
            border-color: #6c757d;
            color: #6c757d;
            font-size: 1rem;
            padding: 12px 25px;
            width: 100%;
            margin-top: 10px;
        }

        .btn-outline-secondary:hover {
            background-color: #6c757d;
            color: white;
            border-color: #5a6268;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-control::placeholder {
            color: #adb5bd;
        }

        .mb-4 {
            margin-bottom: 1.5rem;
        }
    </style>

    <!-- jQuery and Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">

<div class="container">
    <h2>Actualizar Médico</h2>

    <!-- Formulario de actualización -->
    <form th:action="@{/medicos/actualizar}" th:object="${medico}" method="post">

        <input type="hidden" th:field="*{idMedico}" />

        <!-- Nombre -->
        <div class="mb-4">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" id="nombre" th:field="*{nombre}" class="form-control" placeholder="Ingrese el nombre" required>
        </div>

        <!-- Apellido -->
        <div class="mb-4">
            <label for="apellido" class="form-label">Apellido</label>
            <input type="text" id="apellido" th:field="*{apellido}" class="form-control" placeholder="Ingrese el apellido" required>
        </div>

        <!-- Especialidad -->
        <div class="mb-4">
            <label for="especialidad" class="form-label">Especialidad</label>
            <input type="text" id="especialidad" th:field="*{especialidad}" class="form-control" placeholder="Ingrese la especialidad" required>
        </div>

        <!-- Teléfono -->
        <div class="mb-4">
            <label for="telefono" class="form-label">Teléfono</label>
            <input type="text" id="telefono" th:field="*{telefono}" class="form-control" placeholder="Ingrese el teléfono" required>
        </div>

        <!-- Email -->
        <div class="mb-4">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="Ingrese el email" required>
        </div>

        <!-- Dirección -->
        <div class="mb-4">
            <label for="direccion" class="form-label">Dirección</label>
            <input type="text" id="direccion" th:field="*{direccion}" class="form-control" placeholder="Ingrese la dirección" required>
        </div>

        <!-- Disponibilidad -->
        <div class="mb-4">
            <label for="disponibilidad" class="form-label">Disponibilidad</label>
            <input type="text" id="disponibilidad" th:field="*{disponibilidad}" class="form-control" placeholder="Ingrese la disponibilidad" required>
        </div>

        <!-- Botón de Enviar -->
        <button type="submit" class="btn btn-dark w-100 py-3 mb-3">
            Actualizar Médico
        </button>

        <!-- Botón Regresar -->
        <a href="/medicos/listar" class="btn btn-outline-secondary w-100 py-3">
            Regresar
        </a>

    </form>
</div>

</body>

</html>
